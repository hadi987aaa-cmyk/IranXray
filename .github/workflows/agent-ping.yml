name: Agent Ping

# Throwaway diagnostic: proves whether this repository can start any run at all, or whether only
# the build workflow's concurrency group is stuck. Delete once the queue is understood.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Say hello
        run: |
          echo "ping ok on ${{ github.ref_name }}"
          date -u