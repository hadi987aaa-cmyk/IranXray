name: Secret scan

# Guards the bot package: a token pasted into a file is caught before it lives in the repo.
on:
  push:
    branches:
      - "bot/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for credentials
        run: python3 bot/check_no_secrets.py .
